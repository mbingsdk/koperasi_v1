services:
  postgres:
    image: postgres:16-alpine
    container_name: koperasi-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: koperasi
      POSTGRES_PASSWORD: koperasi
      POSTGRES_DB: koperasi_ledger
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koperasi -d koperasi_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
